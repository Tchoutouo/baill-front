<div class="alert-container w-35 shadow">
    <div class="p-relative">
        <div class="alert-content d-flex gap-3 px-3 align-items-center py-4">
            <i class="fa-solid fa-check" id="icon-chek"></i>
            <span>{{message}}</span>
        </div>

        <div class="progress bg-orangeK5" role="progressbar" aria-label="Warning example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar bg-orangeK" [style.width]="progress + '%'"></div>
        </div>
    </div>
</div>
