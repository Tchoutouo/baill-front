<div class="payment-item m-auto w-100" (click)="handlePayment(itemPay?.title)">
    <div class="payment-logo py-2">
        <ng-container *ngIf="itemPay.title == 'Stripe'">
            <img src="../../../../assets/images/stripe.jpg" width="43" alt="" class="img-fluid icon-payment"> 
            <span> {{itemPay.title}} </span>
        </ng-container>
        <ng-container *ngIf="itemPay.title == 'Orange Money'">
            <img src="../../../../assets/images/Logo-om.jpg" width="43" alt="" class="img-fluid icon-payment"> 
            <span> {{itemPay.title}}</span>
        </ng-container>
        <ng-container *ngIf="itemPay.title == 'Mobile Money'">
            <img src="../../../../assets/images/momo.png" width="43" alt="" class="img-fluid icon-payment"> 
            <span>{{itemPay.title}} </span>
        </ng-container>
    </div>
</div>
<div class="stripe-form m-auto pt-3" *ngIf="showStripeForm && itemPay.title == 'Stripe'">
    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="error mt-3">
      {{ errorMessage }}
    </div>
  <!-- Numéro de carte (occupe toute une ligne) -->
  <div class="form-group text-start">
    <label for="card-number-element" class="label-form">{{'admin.payment.card-number'|translate}}</label>
    <div id="card-number-element" class="stripe-element"></div>
  </div>

  <!-- Date d'expiration et CVC (sur la même ligne) -->
  <div class="row">
    <div class="col-md-6">
      <div class="form-group text-start">
        <label for="card-expiry-element" class="label-form">{{'admin.payment.date-expired'|translate}}</label>
        <div id="card-expiry-element" class="stripe-element"></div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group text-start">
        <label for="card-cvc-element" class="label-form">CVC</label>
        <div id="card-cvc-element" class="stripe-element"></div>
      </div>
    </div>
  </div>

  <!-- Bouton de paiement -->
  <button type="submit" class="btn_publish mt-2 mt-3 d-flex align-items-center justify-content-between" [disabled]="createPayMeth" (click)="handlePayment()">
    Payer 
    <div class="spinner-border text-light ms-2" *ngIf="createPayMeth" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </button>
</div>

    <div class="om-form" *ngIf="showOmForm && itemPay.title === 'Orange Money'">
      <form class="w-100" (submit)="mobilePay('Orange Money', $event)">
        <div class="form_group">
          <label class="label-form mb-2" for="omNumber">{{'admin.payment.number'|translate}}</label>
          <input
            type="text"
            class="input_field input-field"
            id="omNumber"
            name="phoneNumber"
            [(ngModel)]="phoneNumber"
            required
            pattern="^6\d{8}$"
            #omInput="ngModel" 
            (click)="$event.stopPropagation()"
          />
          <div *ngIf="omInput.invalid && omInput.touched" style="color:red; font-size:0.8rem;">
            {{'admin.payment.error-number'|translate}}
          </div>
        </div>
        <button type="submit" class="btn_publish mt-2" [disabled]="omInput.invalid">{{'button.pay'|translate}}</button>
      </form>
    </div>
    
    
    <div class="momo-form" *ngIf="showMomoForm && itemPay.title === 'Mobile Money'">
      <form class="w-100" (submit)="mobilePay('Mobile Money', $event)">
        <div class="form_group">
          <label class="label-form mb-2" for="momoNumber">{{'admin.payment.number'|translate}}</label>
          <input
            type="text"
            class="input_field input-field"
            id="momoNumber"
            name="phoneNumber"
            [(ngModel)]="phoneNumber"
            required
            pattern="^6\d{8}$"
            #momoInput="ngModel"
            (click)="$event.stopPropagation()"
          />
          <div *ngIf="momoInput.invalid && momoInput.touched" style="color:red; font-size:0.8rem;">
            {{'admin.payment.error-number'|translate}}
          </div>
        </div>
        <button type="submit" class="btn_publish mt-2" [disabled]="momoInput.invalid">{{'button.pay'|translate}}</button>
      </form>
    </div>
