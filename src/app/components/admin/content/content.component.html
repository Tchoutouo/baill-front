<div class="row m-0">
    <div class="side-bar-container bg-white col-1 d-none d-md-block border_aside px_l_4 sticky-top sticky-left" id="sideBar" (mouseover)="openSideBar(true)" (mouseleave)="openSideBar(false)">
        <aside class="d-flex flex-column flex-shrink-0  pt-2 text-white bg-white h-100 ">
            <div class="p-fixed" id="fixedParent">
                <div class="p-relativer py-5  px-md-1 h-100">
                    <!-- boutton close aside mobile -->
                    <div class="d-md-none aside-mobile p-absolute" (click)="OpenMobileAside(false)">
                        <i class="fa-solid fa-xmark fs-4 green-main"></i>
                    </div>
    
                    <div class="row mb-4">
                        <div class="col-12 label-site d-flex justify-content-center">
                            <a href="#" class="navbar-brand relative d-flex align-items-center">
                                <img class="brand-logo mx-0" src="../../../../assets/baill-logo.ico" alt="">
                                <span class="site_name d-block d-md-none text-hover">{{siteName}}</span>
                            </a>
                        </div>
                    </div>
    
                    <div class="row px-0 px-md-3 content-card mb-4 justify-content-center">
                        <div class="">
                            <div class="row g-0 finger align-items-center my_acc_shadow" id="pict_parent" [routerLink]="['/admin/myAccount']" aria-current="page" >
                                <div class="col-md-12 p col-4 p-0 image_profile" id="profil-picture">
                                    <div class="image-profile img-profile my_acc_shadow_pic" id="picture_child" style="background-image: url('../../../../assets/images/image-user.jpeg');">
                
                                    </div>
                               </div>
                                <div class="col-md-12 col-8 d-block  d-md-none text-hover" id="profil-text">
                                    <div class="py-2 pe-3">
                                        <h4 class="card-title text-dark">{{userName}}</h4>
                                        <p class=""><small class="d-block d-md-none text-dark text-hover wrap-text">{{email}}</small></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
    
                    <div class="row px-0 px-md-3 d-flex element">
                        <div class="col-12 d-flex  justify-content-center mb-4">
                            <ul class="element-list  p-0 px-md-2">
                                <li class="item-list w-100 " routerLinkActive="active">
                                    <a [routerLink]="['/admin/dashboard']" aria-current="page">
                                        <svg routerLinkActive="active"  xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-columns-gap m-ld-auto" viewBox="0 0 16 16">
                                            <path d="M6 1v3H1V1zM1 0a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1V1a1 1 0 0 0-1-1zm14 12v3h-5v-3zm-5-1a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1zM6 8v7H1V8zM1 7a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1zm14-6v7h-5V1zm-5-1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1V1a1 1 0 0 0-1-1z"/>
                                        </svg> 
                                        <p class="d-md-none d-block text-hover" >Tableau de bord</p>
                                    </a>
                                </li>
                                <li class="item-list w-100" routerLinkActive="active">
                                    <a  [routerLink]="['/admin/user-management/users']" aria-current="page">
                                        <i class="fa-solid fa-user-group" routerLinkActive="active"></i>
                                        <p class="d-md-none d-block text-hover">Utilisateurs</p>
                                    </a>       
                                </li>
                                <!-- <li class="item-list w-100" routerLinkActive="active">
                                    <a [routerLink]="['/admin/announces/announces-list']" aria-current="page">
                                        <i class="fa-sharp-duotone fa-solid fa-bullhorn" routerLinkActive="active"></i>
                                        <p class="d-md-none d-block text-hover" >Annonces</p>
                                    </a>       
                                </li> -->
                                <li class="item-list w-100" routerLinkActive="active">
                                    <a [routerLink]="['/admin/announces/announces-list']" aria-current="page">
                                        <i class="fa-sharp-duotone fa-solid fa-bullhorn" routerLinkActive="active"></i>
                                        <p class="d-md-none d-block text-hover" >Annonces & Catégories</p>
                                    </a>       
                                </li>
                                <li class="item-list w-100" routerLinkActive="active">
                                    <a  [routerLink]="['/admin/packages']" aria-current="page">
                                        <!-- <i class="fa-solid fa-credit-card" routerLinkActive="active"></i> -->
                                        <svg routerLinkActive="active" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-credit-card-fill" viewBox="0 0 16 16">
                                            <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1H0zm0 3v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zm3 2h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1"/>
                                        </svg>
                                        <p class="d-md-none d-block text-hover">Forfaits</p>
                                    </a>
                                </li>
                                <li class="item-list w-100" routerLinkActive="active">
                                    <a  [routerLink]="['/admin/payment']" aria-current="page">
                                        <i class="fa-solid fa-sack-dollar" routerLinkActive="active"></i>
                                        <p class="d-md-none d-block text-hover">Paiement</p>
                                    </a>
                                </li>
                                <li class="item-list w-100" routerLinkActive="active">
                                    <a  [routerLink]="['/admin/settings']" aria-current="page">
                                        <i class="fa-solid fa-gear" routerLinkActive="active"></i> 
                                        <p class="d-md-none d-block text-hover">Paramètre</p>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <div class="col-md-12 d-flex justify-content-center mt-5" >
                            <div class="row m-0 p-0 w-fit-content">
                                <div class="col-md-12  d-flex justify-content-end content-logout ">
                                    <button type="button" class="btn d-flex align-items-center " (click)="handleConfirmLogOut(true)">
                                        <p class="d-md-none d-block text-hover" >Déconnexion</p>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-left  fw-bolder" viewBox="0 0 16 16">
                                            <path fill-rule="evenodd" d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z"/>
                                            <path fill-rule="evenodd" d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- le contenu -->
    <div class="content col border_nav">
        <nav class="navbar navbar-expand-lg bg-white sticky-top w-100 border_nav">
            <div class="container-fluid  d-flex  justify-content-beetween admin-nav align-items-center">
                <div class="d-md-none menu-mobile" (click)="OpenMobileAside(true)">
                    <i class="fa-solid fa-bars fs-2 green-main"></i>
                </div>
                
                <ul class="navbar-nav d-md-none">
                    <li class="nav-item">
                        <a class="nav-link"  href="#">
                            <h4 class="card-title text-center"> Hello {{userName}}</h4>
                            <p class="card-text text-center"><small class="text-body-secondary">{{email}} </small></p>
                        </a>
                    </li>
                </ul>

                <a  (click)="hanndleShowNotifications()" class="nav-item  float-rigth notification-button finger d-flex d-md-none justify-content-center align-items-center">
                    <i class="fa-solid fa-bell text-dark"></i>
                </a>
                <div class="d-flex nav-username  justify-content-beetween align-items-center gap-0 gap-md-2">
                    <ul class="navbar-nav d-none d-md-block">
                        <li class="nav-item">
                            <a class="nav-link"  href="#">
                                <h4 class="card-title"> Hello {{userName}}</h4>
                                <p class="card-text"><small class="text-body-secondary">{{email}} </small></p>
                            </a>
                        </li>
                    </ul>
                   
                    <div class="notif w-fit_content gap-4 d-md-flex d-none">
                        <button type="submit" id="publish-button" [routerLink]="['/admin/announces/create']" class="btn text-white float-rigth d-md-flex d-none justify-content-center align-items-center">
                            <i class="fa-solid fa-plus  text-white"></i> Annonce
                        </button>

                        <a  (click)="hanndleShowNotifications()" class="nav-item  float-rigth notification-button finger d-flex justify-content-center align-items-center">
                            <i class="fa-solid fa-bell text-dark"></i>
                        </a>

                        <div class="form-group nav-item  float-rigth d-md-flex d-none">
                            <select class="form-control" (change)="ChangeLanguage($event)" name="">
                                <option [selected]="lang==='fr'" value="fr">FR</option>
                                <option [selected]="lang==='en'" value="en">EN</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <div class="row p-0 w-100 m-0">
            <app-alert-confirm *ngIf="display" (confirmAction)="logOut($event)"></app-alert-confirm>
            <div class="col-12 py-3" style="min-height: 100vh;">
                <router-outlet> </router-outlet>
            </div>
        </div>
    </div>
</div>

<div class="notification" *ngIf="isDiplayedNotification">
    <app-notifications (close)="handleClose()"></app-notifications>
</div>
