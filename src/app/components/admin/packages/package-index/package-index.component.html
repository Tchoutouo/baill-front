<div class="contianer-fluid">
    <div class="page-title px-3">
        <h1>Gestion des forfaits</h1>
    </div>
    <div class="row overflow_x_scroll justify-content-end p-5">
        <div class="col-md-4 d-flex justify-content-end">
            <form class="d-flex w-100 nav_item position-relative">
                <input class="form-control me-2 py-1 px-5" id="search_field" 
                    type="search" placeholder="Recherche ...." 
                    aria-label="chercher"
                >
                <i class="fa-solid fa-magnifying-glass position-absolute search_icon"></i>
            </form>
        </div>
        
        <div class="col-12 d-flex justify-content-start gap-2 align-items-center py-3">
            <h3 class="label-filter m-0">Afficher par</h3>
            <select class="form-select w-25" id="" aria-label="Floating label select example">
                <option value="{{itemRange}}" *ngFor="let itemRange of rangeList">{{itemRange}}</option>
            </select>
        </div>
    
        <div class="result-message text-center fw-bold d-none" >
            Resultat de recherche pour : <span class="search_data"></span>
        </div>
        <div class="result-message fw-bold text-center d-none">
            Aucun resultat pour : <span class="search_data"></span>
        </div>
        
        <div class="col-12">
            <table class="table px-4 m-auto" id="dashboard_table">
                <thead>
                    <tr class="border-bottom-1-green">
                        <th scope="col" class="border-top-1-gray border-left-1-gray">No</th>
                        <th scope="col " class="bord">Nom forfait </th>
                        <th scope="col " class="bord">Prix</th>
                        <th scope="col " class="bord">Durée</th>
                        <th scope="col " class="bord border-right-1-gray">Utilisation (1%)</th>
                        <th scope="col " class="bord">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <ng-container>
                        <tr >
                            <th scope="row" class="bord-black">1</th>
                            <td class="bord-black">
                                Nom
                            </td>
                            <td class="bord-black">
                                Nom
                            </td>
                            <td class="bord-black">Nom</td>
                            <td class="bord-black">Nom</td>
    
                            <!-- Les actions -->
                            <td class="bord-black">
                                <div class="icon-list d-flex gap-2 justify-content-center">
                                    <a  title="Mettre en pause" >
                                        <i class="fa-solid fa-pause bg_grey radius-3 text-dark p-1"></i>
                                    </a>
                                    <a  title="Supprimer" >
                                        <i class="fa-solid fa-trash radius-3 bg_red text-white p-1"></i>
                                    </a>
                                    
                                    <a title="Modifier">
                                        <i class="fa-solid fa-pen bg_blue radius-3 text-white p-1"></i>
                                    </a> 
                                </div>
                            </td>
                            
                        </tr>
                        <tr >
                            <th scope="row" class="bord-black">1</th>
                            <td class="bord-black">
                                Nom
                            </td>
                            <td class="bord-black">
                                Nom
                            </td>
                            <td class="bord-black">Nom</td>
                            <td class="bord-black">Nom</td>
    
                            <!-- Les actions -->
                            <td class="bord-black">
                                <div class="icon-list d-flex gap-2 justify-content-center">
                                    <a  title="Mettre en pause" >
                                        <i class="fa-solid fa-pause bg_grey radius-3 text-dark p-1"></i>
                                    </a>
                                    <a  title="Supprimer" >
                                        <i class="fa-solid fa-trash radius-3 bg_red text-white p-1" ></i>
                                    </a>
                                    
                                    <a title="Modifier">
                                        <i class="fa-solid fa-pen bg_blue radius-3 text-white p-1"></i>
                                    </a> 
                                </div>
                            </td>
                            
                        </tr>
                        <tr >
                            <th scope="row" class="bord-black">1</th>
                            <td class="bord-black">
                                Nom
                            </td>
                            <td class="bord-black">
                                Nom
                            </td>
                            <td class="bord-black">Nom</td>
                            <td class="bord-black">Nom</td>
    
                            <!-- Les actions -->
                            <td class="bord-black">
                                <div class="icon-list d-flex gap-2 justify-content-center">
                                    <a  title="Mettre en pause" >
                                        <i class="fa-solid fa-pause bg_grey radius-3 text-dark p-1"></i>
                                    </a>
                                    <a  title="Supprimer" >
                                        <i class="fa-solid fa-trash radius-3 bg_red text-white p-1"  ></i>
                                    </a>
                                    
                                    <a title="Modifier">
                                        <i class="fa-solid fa-pen bg_blue radius-3 text-white p-1"></i>
                                    </a> 
                                </div>
                            </td>
                            
                        </tr>
                        <tr >
                            <th scope="row" class="bord-black">1</th>
                            <td class="bord-black">
                                Nom
                            </td>
                            <td class="bord-black">
                                Nom
                            </td>
                            <td class="bord-black">Nom</td>
                            <td class="bord-black">Nom</td>
    
                            <!-- Les actions -->
                            <td class="bord-black">
                                <div class="icon-list d-flex gap-2 justify-content-center">
                                    <a title="Republier">
                                        <i class="fa-solid fa-play bg-white radius-3 text_green p-1 border-top-1-green border-bottom-1-green border-left-1-green border-right-1-green">
                                        </i>
                                    </a>
                                    <a  title="Supprimer" >
                                        <i class="fa-solid fa-trash radius-3 bg_red text-white p-1" ></i>
                                    </a>
                                    
                                    <a title="Modifier">
                                        <i class="fa-solid fa-pen bg_blue radius-3 text-white p-1" data-bs-toggle="modal" data-bs-target="#package"></i>
                                    </a> 
                                </div>
                            </td>
                        </tr>     
                    </ng-container>
                </tbody>
            </table>
            
            <!-- Modal -->
            <div class="modal fade" id="package" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="packageLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <app-package-edit></app-package-edit>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
