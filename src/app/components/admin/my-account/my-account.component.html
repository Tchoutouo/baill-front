<div class="container-fluid p-0">
    <form  class="px-5" [formGroup]="profileForm">
        <div class="row">
            <h2 class="title-h2 mb-4">Mon compte</h2>
            <div class="col-md-3">
                <div class="form_group mb-3">
                    <label for="name" class="label-form mb-1">Nom(s)</label>
                    <input type="text" name="last_name" class="input_field" formControlName="last_name"   id="last_name">
                    <div *ngIf="profileForm.get('last_name')?.invalid && profileForm.get('last_name')?.dirty" class="text-danger">
                        Le nom est requis.
                    </div>
                </div>
                
                <div class="form_group mb-3">
                    <label for="name" class="label-form mb-1">Prénom(s)</label>
                    <input type="text" name="first_name" class="input_field" formControlName="first_name" id="first_name">
                    <div *ngIf="profileForm.get('first_name')?.invalid && profileForm.get('first_name')?.dirty" class="text-danger">
                        Le prénoms est requis.
                    </div>
                </div>
                <div class="form_group mb-3">
                    <label for="userName" class="label-form mb-1">Nom d’utilisateur</label>
                    <input type="text" name="username" class="input_field" formControlName="username" id="userName"/>
                    <div *ngIf="profileForm.get('username')?.invalid && profileForm.get('username')?.dirty" class="text-danger">
                        Le nom d'utilisateur est requis.
                    </div>
                </div>
                <div class="form_group mb-3">
                    <label for="email" class="label-form mb-1">Email</label>
                    <input type="email" name="email" class="input_field" formControlName="email"   id="email"/>
                    <div *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="text-danger">
                        Email invalide ou manquant.
                    </div>
                </div>
                <div class="form_group mb-3">
                    <label for="phone" class="label-form mb-1">Télephone</label>
                    <input type="tel" name="number" class="input_field" formControlName="number"  id="number"/>
                    <div *ngIf="profileForm.get('number')?.invalid && profileForm.get('number')?.touched" class="text-danger">
                        Le numéro de téléphone est requis.
                    </div>
                </div>
                <div class="form_group mb-3">
                    <label for="phone" class="label-form mb-1">Télephone (WhatsApp)</label>
                    <input type="tel" name="phone" class="input_field" formControlName="whatsapp_number" id="phone"/>
                    <div *ngIf="profileForm.get('whatsapp_number')?.invalid && profileForm.get('whatsapp_number')?.touched" class="text-danger">
                        Le numéro de téléphone whatsapp est requis.
                    </div>
                </div>
                <div class="checkbox-input">
                    <label for="" class="label-form mb-1">Sexe</label>
                    <div class="form-check d-flex gap-3">
                        <div class="check-item d-flex gap-1">
                            <input type="radio" class="form-check rounded-circle" formControlName="sex" value="1"  name="sex" id="H" [checked]="user.sex == true">
                            <label for="H" class="fs-6" >H</label>
                        </div>
                        <div class="check-item d-flex gap-1">
                            <input type="radio"  class="form-check"  name="sex" id="F" formControlName="sex"  value="0"[checked]="user.sex == false">
                            <label for="F" class="fs-6" >F</label>
                        </div>
                        <div *ngIf="profileForm.get('sex')?.invalid && profileForm.get('sex')?.touched" class="text-danger">
                            Veuillez choisir votre sexe
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3 offset-md-1">
                <div class="form_group mb-3">
                    <label for="country" class="label-form mb-1">Pays</label>
                    <select id="country" formControlName="country"(change)="onCountryChange($event)" name="country" class="form-control" required="required">
                        <option *ngFor="let country of countries" [value]="country.isoCode">{{ country.name }}</option>
                    </select>
                    <!-- <i class="fa-solid fa-chevron-down text-success"></i> -->
                    <!-- <i class="fa-solid fa-sort-down text-success" style="position:relative; bottom: 22px; left: Opx;"></i> -->
                </div>
                <div class="form_group mb-3">
                    <label for="city" class="label-form mb-1">Ville</label>
                    <select formControlName="city" name="city" id="city" class="form-control" required="required">
                        <option *ngFor="let city of cities" [value]="city.name" [selected]="city.name == user.city">
                            {{ city.name }}
                        </option>
                    </select>
                </div>
                <div class="form_group mb-3">
                    <label for="neighborhood" class="label-form mb-1">Quartier</label>
                    <input type="text" name="neighborhood" class="input_field" formControlName="neighborhood"  id="neighborhood">
                </div>
                <div class="form_group mb-3">
                    <label for="site_url" class="label-form mb-1">Lien du site web</label>
                    <input type="text" name="site_url" class="input_field" formControlName="site_url" id="site_url">
                </div>
                <!-- <div class="form_group mb-3">
                    <label for="cni" class="label-form mb-1">Numero CNI</label>
                    <input type="text" name="cni" class="input_field" [(ngModel)]="user.cni" #cni="ngModel" id="cni">
                    <div *ngIf="cni.invalid && cni.touched" class="text-danger">
                        Veuillez saisir votre numéro d'identifiant
                    </div>
                </div> -->
            </div>

            <div class="col-md-3  text-center offset-md-1">
                <div *ngIf="picture === false; else loadPicture">
                    <i class="fa-solid fa-user profil-user"></i>
                </div>
                <ng-template #loadPicture>
                    <div class=" row d-flex justify-content-center">
                        <div class="load-image" style="background-image: url('{{picture}}');"></div>
                    </div>
                </ng-template>
                <div *ngIf="fileError" class="text-danger">
                    {{ fileError }}
                </div>
                <div class="update-picture justify-content-center d-flex align-items-center gap-2">
                    <span>Photo</span>
                    <label for="picture">
                        <input type="file" name="picture"  (change)="addImage($event)" class="d-none" id="images" accept="image/*"/>

                        <button class="add_caract my-2" (click)="handleAddImage($event)">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </label>
                </div>

                <div class="field-password py-3 px-5 my-3">
                    <h3 class="text-start py-3">Securité</h3>
                    <label for="password" class="password-pass d-flex justify-content-start mb-2">Mot de passe</label>
                    <div class="d-flex gap-3 pb-1 align-items-center">
                        <div class="password-input-group">
                            <input type="{{type}}" name="password"  class="password-profile" id="password">
                            <i class="fa-solid fa-eye{{icon_eyes}} icon_pass" (click)="chanIcon($event)"></i>
                        </div>
                        <a class="add_caract" (click)="openModalPassword($event)">
                            <i class="fa-solid fa-pen text-white"></i>
                        </a>
                    </div>

                </div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-md-12">
                <button (click)="UpdateProfil()" class="btn-form bg_blue" [disabled]="profileForm.invalid">Modifier les champs</button>
            </div>
        </div>
    </form>

    <div class="modal-backdrop" *ngIf="isModalOpen">
        <div class="modal_password">
            <div class="modal_header">
                <h3 class="modal_title">Modification du mot de passe</h3>
                <button type="button" class="close-btn" (click)="closeModal()">×</button>
            </div>
            <div class="modal_body">
                <form (ngSubmit)="changePassword()" #form="ngForm" id="formPassord">
                    <div class="mb-3">
                        <label for="name" class="form-label">Ancien mot de passe</label>
                        <input type="password" class="form-control" id="name" name="password" ngModel required>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Nouveau mot de passe</label>
                        <input type="password" class="form-control" id="name" name="newPassword" ngModel required>
                    </div>
                    <button type="submit" id="submit-button" class="btn btn-primary" [disabled]="form.invalid">Sauvegarder</button>
                </form>
            </div>
        </div>
    </div>
</div>
