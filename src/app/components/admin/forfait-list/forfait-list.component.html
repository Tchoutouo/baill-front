 <!-- Modal -->
 <div class="modal fade" id="forfaitList" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog  modal-dialog-centered" id="my-model-forfait">
      <div class="modal-content">
        <div class="modal-body py-4">
            <h4 class="modal-title title-list pb-4 px-3">Choisissez un forfait</h4>
            <div class="row mx-0">
                <div class="col-md-4" *ngFor = "let item of list_forfati">
                    <app-forfait-item></app-forfait-item>
                </div>
            </div>
        </div>
        
        <div class="d-flex justify-content-end pe-4 pb-4 ">
            <button type="button" class="btn bg_grey-15 text-white" id="cancel_btn" data-bs-dismiss="modal">Annuler</button>
        </div>
        
      </div>
    </div>
</div>
