<div class="container-fluid p-0">
    <form  class="px-5">
        <div class="row">
            <h2 class="title-h2 mb-4">Mon compte</h2>
            <div class="col-md-3">
                <div class="form_group mb-3">
                    <label for="name" class="label-form mb-1">Nom(s)</label>
                    <input  readonly type="text"  name="last_name" class="input_field" formControlName="last_name"   id="last_name">
                </div>
                
                <div class="form_group mb-3">
                    <label for="name" class="label-form mb-1">Prénom(s)</label>
                    <input  readonly type="text" name="first_name" class="input_field" formControlName="first_name" id="first_name">
                   
                </div>
                <div class="form_group mb-3">
                    <label for="userName" class="label-form mb-1">Nom d’utilisateur</label>
                    <input  readonly type="text" name="username" class="input_field" formControlName="username" id="userName"/>
                  
                </div>
                <div class="form_group mb-3">
                    <label for="email" class="label-form mb-1">Email</label>
                    <input  readonly type="email" name="email" class="input_field" formControlName="email"   id="email"/>
                  
                </div>
                <div class="form_group mb-3">
                    <label for="phone" class="label-form mb-1">Télephone</label>
                    <input  readonly type="tel" name="number" class="input_field" formControlName="number"  id="number"/>
                   
                </div>
                <div class="form_group mb-3">
                    <label for="phone" class="label-form mb-1">Télephone (WhatsApp)</label>
                    <input  readonly type="tel" name="phone" class="input_field" formControlName="whatsapp_number" id="phone"/>
                </div>
                <div class="checkbox-input">
                    <label for="" class="label-form mb-1">Sexe</label>
                    <div class="form-check d-flex gap-3">
                        <div class="check-item d-flex gap-1">
                            <input  readonly type="radio" class="form-check rounded-circle" formControlName="sex" value="1"  name="sex" id="H">
                            <label for="H" class="fs-6" >H</label>
                        </div>
                        <div class="check-item d-flex gap-1">
                            <input  readonly type="radio"  class="form-check"  name="sex" id="F" formControlName="sex"  value="0">
                            <label for="F" class="fs-6" >F</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3 offset-md-1">
                <div class="form_group mb-3">
                    <label for="country" class="label-form mb-1">Pays</label>
                    <select id="country" formControlName="country" name="country" class="form-control" required="required">
            <option ></option>
                    </select>
                    <!-- <i class="fa-solid fa-chevron-down text-success"></i> -->
                    <!-- <i class="fa-solid fa-sort-down text-success" style="position:relative; bottom: 22px; left: Opx;"></i> -->
                </div>
                <div class="form_group mb-3">
                    <label for="city" class="label-form mb-1">Ville</label>
                    <select formControlName="city" name="city" id="city" class="form-control" required="required">
                        
                    </select>
                </div>
                <div class="form_group mb-3">
                    <label for="neighborhood" class="label-form mb-1">Quartier</label>
                    <input  readonly type="text" name="neighborhood" class="input_field" formControlName="neighborhood"  id="neighborhood">
                </div>
                <div class="form_group mb-3">
                    <label for="site_url" class="label-form mb-1">Lien du site web</label>
                    <input  readonly type="text" name="site_url" class="input_field" formControlName="site_url" id="site_url">
                </div>
                <!-- <div class="form_group mb-3">
                    <label for="cni" class="label-form mb-1">Numero CNI</label>
                    <input  readonly type="text" name="cni" class="input_field" [(ngModel)]="user.cni" #cni="ngModel" id="cni">
                    <div *ngIf="cni.invalid && cni.touched" class="text-danger">
                        Veuillez saisir votre numéro d'identifiant
                    </div>
                </div> -->
            </div>

            <div class="col-md-3  text-center offset-md-1">
                <div>
                    <i class="fa-solid fa-user profil-user"></i>
                </div>
                
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-md-12">
                <button  class="btn-form btn bg-danger rounded-pill text-white" >Bloquer</button>
            </div>
        </div>
    </form>
</div>
