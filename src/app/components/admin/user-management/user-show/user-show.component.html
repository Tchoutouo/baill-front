<div class="container-fluid p-0">
    <div class="alert-message">
        <app-alert *ngIf="display_message" (timeOut) ="closeAlert($event)" [message] = "message_alert"></app-alert>
    </div>
    <form  class="px-5">
        <div class="row">
            <h2 class="title-h2 mb-4">Détails du compte utilisateur : {{advertiser?.last_name}} </h2>
            <div class="col-md-3">
                <div class="form_group mb-3">
                    <label for="name" class="label-form mb-1">Nom(s)</label>
                    <input  readonly type="text" [value]="advertiser?.last_name" name="last_name" class="input_field" formControlName="last_name"   id="last_name">
                </div>
                
                <div class="form_group mb-3">
                    <label for="name" class="label-form mb-1">Prénom(s)</label>
                    <input  readonly type="text" [value]="advertiser?.first_name" name="first_name" class="input_field" formControlName="first_name" id="first_name">
                </div>
                <div class="form_group mb-3">
                    <label for="userName" class="label-form mb-1">Nom d’utilisateur</label>
                    <input  readonly type="text" [value]="advertiser?.username" name="username" class="input_field" formControlName="username" id="userName"/>
                </div>
                <div class="form_group mb-3">
                    <label for="email" class="label-form mb-1">Email</label>
                    <input  readonly type="email" [value]="advertiser?.email" name="email" class="input_field" formControlName="email"   id="email"/>
                </div>
                <div class="form_group mb-3">
                    <label for="phone" class="label-form mb-1">Téléphone</label>
                    <input  readonly type="tel" name="number" [value]="advertiser?.number" class="input_field" formControlName="number"  id="number"/>
                </div>
                <div class="form_group mb-3">
                    <label for="phone" class="label-form mb-1">Téléphone (WhatsApp)</label>
                    <input  readonly type="tel" name="phone" [value]="advertiser?.whatsapp_number"  class="input_field" formControlName="whatsapp_number" id="phone"/>
                </div>
                <div class="checkbox-input">
                    <label for="" class="label-form mb-1">Sexe</label>
                    <div class="form-check d-flex gap-3">
                        <div class="check-item d-flex gap-1">
                            <input type="radio" class="form-check rounded-circle" formControlName="sex" value="1"  name="sex" id="H" [checked]="advertiser?.sex == true">
                            <label for="H" class="fs-6" >H</label>
                        </div>
                        <div class="check-item d-flex gap-1">
                            <input type="radio"  class="form-check"  name="sex" id="F" formControlName="sex"  value="0"[checked]="advertiser?.sex == false">
                            <label for="F" class="fs-6" >F</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 offset-md-1">
                <div class="form_group mb-3">
                    <label for="country" class="label-form mb-1">Pays</label>
                    <input  readonly type="text" name="country" [value]="advertiser?.country | getContryByCode"  class="input_field" formControlName="country" id="country"/>
                </div>
                <div class="form_group mb-3">
                    <label for="city" class="label-form mb-1">Ville</label>
                    <input  readonly type="text" name="city" [value]="advertiser?.city"  class="input_field" formControlName="city" id="city"/>
                </div>
                <div class="form_group mb-3">
                    <label for="neighborhood" class="label-form mb-1">Quartier</label>
                    <input  readonly type="text" name="neighborhood" [value]="advertiser?.neighborhood" class="input_field" formControlName="neighborhood"  id="neighborhood">
                </div>
                <div class="form_group mb-3">
                    <label for="site_url" class="label-form mb-1">Lien du site web</label>
                    <input  readonly type="text" name="site_url" [value]="advertiser?.site_url"  class="input_field" formControlName="site_url" id="site_url">
                </div>
                <!-- <div class="form_group mb-3">
                    <label for="cni" class="label-form mb-1">Numero CNI</label>
                    <input  readonly type="text" name="cni" class="input_field" [(ngModel)]="user.cni" #cni="ngModel" id="cni">
                    <div *ngIf="cni.invalid && cni.touched" class="text-danger">
                        Veuillez saisir votre numéro d'identifiant
                    </div>
                </div> -->
            </div>

            <div class="col-md-3  text-center offset-md-1">
                <div *ngIf="advertiser?.picture == null; else loadPicture">
                    <i class="fa-solid fa-user profil-user"></i>
                </div>
                <ng-template #loadPicture>
                    <div class=" row d-flex justify-content-center">
                        <div class="load-image" style="background-image: url('{{advertiser?.picture}}');"></div>
                    </div>
                </ng-template>
            </div>
        </div>
        <!-- <div class="row mt-5">
            <div class="col-md-12">
                <div *ngIf="advertiser?.status == 1"  class="bg-danger text-white px-2 py-1 rounded" (click)="handleConfirm(true)">Bloquer</div>
                <div *ngIf="advertiser?.status == 0"  class="bg-secondary text-white px-2 py-1 rounded" (click)="handleConfirm(true)">Débloquer</div>
                <app-alert-confirm *ngIf="showAlert" (confirmAction)="disabledAdvertiser($event , advertiser)"></app-alert-confirm>
            </div>
        </div> -->
    </form>
</div>
