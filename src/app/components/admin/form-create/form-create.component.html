<div class="contaner-fluid px-4">
    <div class="page-title">
        <h1>Annonces</h1>
    </div>

    <div class="title-form py-4">
        <h4>Formulaire de création d’une annonce</h4>
    </div>

    <div class="row">
        <form action="" class="px-5" [formGroup]="anounces_form_datas" *ngIf="anounces_form_datas" (ngSubmit)="handleSubmit()">
            <div class="row">
                <div class="col-md-5">
                    <div class="form_group gap-1 mb-4">
                        <label for="title" class="label-form mb-2">Titre<span class="text-danger mx-2">*</span></label> 
                        <input type="text" [formControl]="title" class=" form-control input-field" required name="title" id="title" placeholder="voture toyota">
                    </div>
                    <div *ngIf="title.dirty && !title.valid">
                        <div class="" class="error" *ngIf="title.hasError('required')">
                            veuiller renseigner ce champ 
                        </div>
                    </div>

                    <div class="form_group mb-4">
                        <label class="label-form mb-2" for="categorie">Catégorie<span class="text-danger mx-2">*</span></label>
                        <select multiple name="categorie" id="categorie[]" class="form-control input-field" [formControl]="categorie" required="required">
                            <option [value]="1" value="1">Services Professionnels</option>
                            <option [value]="2" >Matériel et Equipements</option>
                            <option [value]="3" >Evenement et Services</option>
                            <option [value]="4" >Vehicules et Transport</option>
                        </select>
                    </div>
                    <div *ngIf="categorie.dirty && !categorie.valid">
                        <div class="" class="error" *ngIf="categorie.hasError('required')">
                            veuiller renseigner ce champ 
                        </div>
                    </div>

                    <div class="form_group gap-1 mb-4">
                        <label for="price" class="label-form mb-2">Prix (FCFA)<span class="text-danger mx-2">*</span></label> 
                        <input type="number" class=" form-control input-field"  [formControl]="price" name="price" id="price" placeholder="voture toyota">
                    </div>
                    <div *ngIf="price.dirty && !price.valid">
                        <div class="" class="error" *ngIf="price.hasError('required')">
                            veuiller renseigner ce champ 
                        </div>
                    </div>

                    <div class="form_group gap-1 mb-4">
                        <label for="description" class="label-form mb-2">Description<span class="text-danger mx-2">*</span></label> 
                        <textarea name="description"  [formControl]="description" class="form-control input-field" required id="description" rows="5" cols="10"></textarea>
                    </div>
                    <div *ngIf="description.dirty && !description.valid">
                        <div class="" class="error" *ngIf="description.hasError('required')">
                            veuiller renseigner ce champ 
                        </div>
                    </div>

                    <div class="form_group gap-1 mb-4">
                        <label for="country" class="label-form mb-2">Pays<span class="text-danger mx-2">*</span></label> 
                        <input type="text" class=" form-control input-field"  [formControl]="country" name="country" id="country" placeholder="voture toyota">
                    </div>
                    <div *ngIf="country.dirty && !country.valid">
                        <div class="" class="error" *ngIf="country.hasError('required')">
                            veuiller renseigner ce champ 
                        </div>
                    </div>
                </div>

                <div class="offset-md-2 col-md-5">
                    <div class="form_group gap-1 mb-4">
                        <label for="city" class="label-form mb-2">Ville<span class="text-danger mx-2">*</span></label> 
                        <input type="text" class=" form-control input-field"  name="city" required id="city" placeholder="voture toyota">
                    </div>
                    <div *ngIf="title.dirty && !title.valid">
                        <div class="" class="error" *ngIf="title.hasError('required')">
                            veuiller renseigner ce champ 
                        </div>
                    </div>

                    <div class="form_group gap-1 mb-4">
                        <label for="neighborhood" class="label-form mb-2">Lieu dit<span class="text-danger mx-2">*</span></label> 
                        <input type="text" class=" form-control input-field" name="neighborhood" required id="neighborhood" [formControl]="neighborhood" placeholder="Yde, Damas 423">
                    </div>
                    <div *ngIf="neighborhood.dirty && !neighborhood.valid">
                        <div class="" class="error" *ngIf="neighborhood.hasError('required')">
                            veuiller renseigner ce champ 
                        </div>
                    </div>

                    <!-- <div class="error" *ngIf="email.dirty && !email.valid">
                        <p *ngIf="email.hasError('required')">
                            l'email est obligatoire
                        </p>
                        <p *ngIf="!email.hasError('required')">
                            l'email n'est ne respecte pas le bon format.
                        </p>
                    </div> -->

                        <label for="caract" class="label-form mb-2">Caractéristiques<span class="text-danger mx-2">*</span></label> 
                        <div class="cateristics">
                            <div class="row">
                                <div class="col-md-2">
                                    <button class="add_caract my-2" >
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-field my-2 "  name="categories" id="categories"  placeholder="Ajouter une catgorie">
                                </div>
                            </div>

                            <ng-container *NgFor="category of categoriesList track image; let  i = index">

                                    <div class="col-3">
                                        <div class="tag-caract">
                                            Taille
                                        </div>
                                    </div>
                                    <div class="col-8">

                                    </div>
                                    <div class="col-1">
                                        <i class="fa-solid fa-xmark"></i>
                                    </div>
                                </div>
                            </ng-container>
                        </div>
                    </div> -->

                    <div class="form_group gap-1 mb-4">
                        <app-image-view (imageList_)="getImagesList($event)"></app-image-view >
                        <p class="error" *ngIf="errorMessages">
                            {{errorMessages}}
                        </p>
                        
                    </div>

                </div>
            </div>
            <div class="row mx-0 gap-4 py-4 align-items-center">
                <button type="button" class="btn btn-primary" id="create" [disabled]="!this.anounces_form_datas.valid && !valiData" data-bs-toggle="modal" data-bs-target="#forfaitList" class="btn-form bg_green">
                    Creer & publier
                    <app-forfait-list (hasSubmit)="handleSubmit($event)"></app-forfait-list>
                </button>
                <button type="submit" (click)="handleSubmit(null)" [disabled]="!this.anounces_form_datas.valid && !valiData" class="btn-form bg_blue my-4" >Enregistrer</button>
            </div>
        </form>
    </div>
</div>
