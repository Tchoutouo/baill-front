<div class="forfait-item py-4 px-3">
    <div class="forfait-title pb-0">
        <h2>{{abonment?.name}}</h2>
    </div>

    <div class="row align-items-center pt-3">
        <div class="col-9 pe-0">
            <div class="price">
                <h4 class="fs_big m-0">{{abonment?.price - (abonment?.price * (abonment?.remise/100)) | currency:'XAF':'symbol':'1.0-0':'fr-CM'}}<span class="fs_small"></span></h4>
            </div>
        </div>
        <div class="col-3 d-flex justify-content-end">
            <div class="reduction">
                {{abonment?.remise}} %
            </div>
        </div>
    </div>
    <div class="duration mb-3">
        {{ abonment?.type_value}} 
        <!-- {{abonment?.time | formatTime:abonment?.type_time}} -->
        <!-- {{abonment?.time | formatTime:abonment?.type_time}} -->
    </div>

    <button type="submit"  class="btn-form w-100 bg_blue">{{'button.throw'|translate}}</button>
</div>
