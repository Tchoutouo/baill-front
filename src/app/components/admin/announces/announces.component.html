<div class="contaner-fluid px-4">
    <div class="page-title">
        <h1>Annonces</h1>
    </div>

    <div class="add-annouce py-4">
        <a [routerLink]="['/admin/announces/create']" id="publish-button" class="d-flex align-items-center">
            <i class="fa-solid fa-plus mx-1 text-white"></i>
            Ajouter
        </a>
    </div>

    <div class="alert-message">
        <app-alert *ngIf="display_message" (timeOut) ="closeAlert($event)" [message] = "message_alert"></app-alert>
    </div>

    <div class="row">
        <div class="col-12 d-flex justify-content-end">
            <form class="d-flex nav_item position-relative w-40">
                <input class="form-control me-2 py-1 px-5" id="search_field" 
                    type="search" placeholder="Recherche ...." 
                    aria-label="chercher"
                    (keyup)="searchValue($event)"
                    (search)="searchValue($event)"
                >
                <i class="fa-solid fa-magnifying-glass position-absolute search_icon"
                (click)="searchValue($event)">
                </i>
            </form>
        </div>
        
        <div class="col-12 d-flex justify-content-start gap-2 align-items-center py-3">
            <h3 class="label-filter m-0">Afficher par</h3>
            <select class="form-select w-25" id="" aria-label="Floating label select example" (change)="setPageLimit($event)">
                <option value="{{itemRange}}" *ngFor="let itemRange of rangeList">{{itemRange}}</option>
            </select>
        </div>

        <div class="col-12">
            <table class="table px-4 m-auto" id="dashboard_table">
                <thead>
                    <tr class="border-bottom-1-green">
                        <th scope="col" class="border-top-1-gray border-left-1-gray">No</th>
                        <th scope="col " class="bord" *ngFor="let itemHead of headLines">{{itemHead | formatEntityName}}</th>
                        <th scope="col " class="bord border-right-1-gray">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor=" let value_datas of annouces; let index = index">
                        <th scope="row" class="bord-black">{{paginationDAtas.allcount - (paginationDAtas.current-1) * pageLImit - index}}</th>
                        <td class="bord-black">AN001</td>
                        <td class="bord-black">{{value_datas.title}}</td>
                        <td class="bord-black">
                           <div class="d-flex gap-2">
                                <div class="cat-item" *ngFor="let category of value_datas.name_categorie">
                                    {{category}}
                                </div>
                           </div>
                        </td>
                        <td class="bord-black">345K</td>
                        <!-- Les satus -->
                        <td class="bord-black">
                            <div class="watting" *ngIf="value_datas.status == '1'">En cours</div>
                            <div class="paused" *ngIf="value_datas.status == '2'">En pause</div>
                            <div class="published" *ngIf="value_datas.status == '3'">Publié</div>
                            <div class="expired" *ngIf="value_datas.status == '0'">Expiré</div>
                        </td>
                        <!-- Les actions -->
                        <td class="bord-black">
                            <div class="icon-list d-flex gap-2 justify-content-center">
                                <a *ngIf="value_datas.status == '1'" >
                                    <i class="fa fa-check bg-green  p-1 radius-3 text-white"></i>
                                </a>
                                <a *ngIf="value_datas.status == '1'">
                                    <i class="fa-solid fa-trash radius-3 bg_red text-white p-1"></i>
                                </a>
                                <a *ngIf="value_datas.status == '2'" (click)="publishAnnounce(value_datas?.id)">
                                    <i class="fa-solid fa-play bg-white radius-3 text_green p-1 border-top-1-green border-bottom-1-green border-left-1-green border-right-1-green">
                                    </i>
                                </a>
                                <a *ngIf="value_datas.status == '3'">
                                    <i class="fa-solid fa-pause bg_grey radius-3 text-dark p-1"></i>
                                </a>
                                <a *ngIf="value_datas.status == '0'">
                                    <i class="fa-solid fa-arrows-rotate bg_blue radius-3 text-white p-1"></i>
                                </a> 
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="col-12 py-3 d-flex justify-content-end">
            <app-paginator
                [current] = "paginationDAtas?.current" 
                [allcount] = "paginationDAtas?.allcount" 
                [next] = "paginationDAtas?.next" 
                [previous] = "paginationDAtas?.previous" 
                [paginateLength] = "paginationDAtas?.paginateLength" 
                [pageLimit] = "pageLImit"
                (pageSelected)="setPage($event)"
            >
            </app-paginator> 
        </div>
    </div>
</div>
