<div class="contaner-fluid px-4">
    <div class="page-title">
        <h1>{{'admin.payment-config.page-title' | translate}}</h1>
    </div>
    <div class="row section-body">
        <div class="col-md-7 card-payment">
            <div class="card-content">
                <div class="mb-4 ps-3">
                    <button (click)="acitveChange()" [ngClass]="activeUpdate ? 'btn-not-active' : 'button-active'">
                        {{'button.enable-editing' | translate}}
                    </button>
                </div>
                <form [formGroup]="paymentForm" (ngSubmit)="setPayment()">

                    <div class="row mx-0 align-items-center payment">
                        <div class="col-10">
                            <div class="payment-type">
                                <img src="../../../../assets/images/logo-om.png" alt="Orange Money" class="icon-payment">
                                <span>Orange Money</span>
                            </div>
                        </div>
                        <div class="col-2">
                            <div class="form-check form-switch check-box">
                                <input class="form-check-input"
                                    [checked]="reciecedValue?.om"
                                    [disabled]="!activeUpdate"
                                    [ngClass]="{'disabled': !activeUpdate, 'active': activeUpdate, 'not-active': !activeUpdate}"
                                    type="checkbox" formControlName="om" role="switch" id="switchOm">
                            </div>
                        </div>
                    </div>

                    <div class="row mx-0 align-items-center payment">
                        <div class="col-10">
                            <div class="payment-type">
                                <img src="../../../../assets/images/momo.png" alt="Mobile Money" class="icon-payment">
                                <span>Mobile Money</span>
                            </div>
                        </div>
                        <div class="col-2">
                            <div class="form-check form-switch check-box">
                                <input class="form-check-input"
                                    [checked]="reciecedValue?.momo"
                                    [disabled]="!activeUpdate"
                                    [ngClass]="{'disabled': !activeUpdate, 'active': activeUpdate, 'not-active': !activeUpdate}"
                                    type="checkbox" formControlName="momo" role="switch" id="switchMomo">
                            </div>
                        </div>
                    </div>

                    <div class="row mx-0 align-items-center payment">
                        <div class="col-10">
                            <div class="payment-type">
                                <img src="../../../../assets/images/stripe.jpg" alt="Stripe" class="icon-payment">
                                <span>Stripe</span>
                            </div>
                        </div>
                        <div class="col-2">
                            <div class="form-check form-switch check-box">
                                <input class="form-check-input"
                                    [checked]="reciecedValue?.stripe"
                                    [disabled]="!activeUpdate"
                                    [ngClass]="{'disabled': !activeUpdate, 'active': activeUpdate, 'not-active': !activeUpdate}"
                                    type="checkbox" formControlName="stripe" role="switch" id="switchStripe">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center align-items-center">
                        <div class="btn-save-change" *ngIf="activeUpdate">
                            <button type="submit">{{'admin.payment-config.save-changes' | translate}}</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
