<footer class="site-footer">
    <div class="footer-inner container">

        <!-- Brand -->
        <div class="footer-brand">
            <a href="#" class="brand-link">
                <img class="brand-logo" src="../../../../assets/baill-logo.ico" alt="{{siteName}} logo">
                <span class="site-name">{{siteName}}</span>
            </a>
            <p class="footer-copy">©{{currentYear}} Bailleurnet. {{'footer.access-right' | translate}}</p>
        </div>

        <!-- Contact -->
        <div class="footer-contact">
            <p class="footer-section-title">{{'footer.contact' | translate}}</p>
            <div class="contact-list">
                <a [routerLink]="['/contact-us']" class="footer-link">
                    <i class="fa-regular fa-envelope"></i>
                    {{'footer.contact-by-email' | translate}}
                </a>
                <a [href]="'https://api.whatsapp.com/send?phone=237694798186&text=Hello Bailleurnet&source=&data='"
                    class="footer-link" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-whatsapp"></i>
                    +237 694 798 186
                </a>
            </div>
        </div>

        <!-- Social + QR -->
        <div class="footer-social">
            <p class="footer-section-title">{{'footer.follow-us' | translate}}</p>
            <div class="social-row">
                <a href="#" class="social-icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="social-icon" aria-label="Twitter/X"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="social-icon" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#" class="social-icon" aria-label="Chat"><i class="fa-solid fa-comment"></i></a>
            </div>
            <div #canvas id="canvas" class="qr-canvas"></div>
        </div>

    </div>
</footer>
