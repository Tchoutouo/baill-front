<section class="hero-section">
    <div class="hero-inner container">

        <div class="hero-text">
            <h1 class="hero-title">{{'banner.title-3' | translate}}</h1>
            <p class="hero-desc">{{'banner.description' | translate}}</p>
            <div class="hero-ctas">
                <a href="https://yango.com/en_cm/" class="hero-btn btn-yango" target="_blank" rel="noopener noreferrer">
                    YANGO
                </a>
                <a [routerLink]="['/admin/announces/create']" class="hero-btn btn-publish">
                    <i class="fas fa-plus"></i>
                    {{'banner.btn-publish' | translate}}
                </a>
            </div>
        </div>

        <div class="hero-visual">
            <div class="hero-img"></div>
        </div>

    </div>
</section>
