<div class="product-list" >
    <ng-container>
        <app-tags-list (filterParams) = "filterDatas($event)"></app-tags-list>
    </ng-container>

    <div class="list-product" *ngIf="products">
        <div class="row">       
            <div class="col-md-6 col-lg-4" *ngFor="let item of products">
                <app-product [productItem]="item"></app-product>
            </div> 
        </div>
    </div>
    <div class="annonces-not-found row" *ngIf="!products">
        <div class="col-12 d-flex text justify-content-center">
            {{'user.product-detail.no-announce'| translate}}
        </div>
    </div>
</div>

<div class="container d-block mb-5 pb-2">
    <div class="row">
        <div class="col-lg-12 d-flex pt-2 justify-content-center" *ngIf="products">
            <app-paginator 
                [currentPage] ="paginationDatas?.current"
                [total] ="paginationDatas?.total"
                [next] ="paginationDatas?.next"
                [previous] ="paginationDatas?.previous"
                [lastElement] ="paginationDatas?.last"
                [pageL_limit] = "pageLimit"
                (setPage)="setPageCurrent($event)"
            ></app-paginator>
        </div>
    </div>
</div>
