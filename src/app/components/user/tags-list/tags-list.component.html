<div class="tag-list mb-5 row">
    <div class="col-md-3 mb-1">
        <select name="category" id="category" class="form-control filter-tag">
            <option value="" selected>Selectionner une categorie</option>
            <option *ngFor="let category of categories" [value]="category.id"> {{ category.title }} </option>
        </select>
    </div>
    <div class="col-md-3 mb-1">
        <select id="country" [(ngModel)]="selectedCountry" (change)="onCountryChange($event)" name="country" class="form-control filter-tag" placeholder="Veuillez selectionner un pays">
            <option value="" selected>Selectionner un pays</option>
            <option *ngFor="let country of countries" [value]="country.isoCode">{{ country.name }}</option>
        </select>
    </div>
    <div class="col-md-3 mb-1">
        <select [(ngModel)]="selectedCity" name="city" id="city" class="form-control filter-tag" placeholder="Veuillez selectionner une ville">
            <option value="" selected>Selectionner une ville</option>
            <option *ngFor="let city of cities" [value]="city.name">
                {{ city.name }}
            </option>
        </select>
    </div>
    <div class="col-md-3 text-center">
        <button class="filter-tag active-tag w-100 text-center">All</button>
    </div>
</div>
