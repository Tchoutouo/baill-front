<div class="categories-container p-4">
    <div class="title-list">
        <h2>Categories</h2>
    </div>

    <ul class="categories mb-4">
        <li class="category-item active_category py-2">
            Habitation et Hébergement
        </li>
        <li class="category-item py-2">
            Services Professionnels
        </li>
        <li class="category-item py-2">
            Matériel et Équipements
        </li>
        <li class="category-item py-2">
            Événements et Services
        </li>
        <li class="category-item py-2">
            Véhicules et Transport
        </li>
    </ul>

    <div class="about-price">
        <div class="title-list mb-3">
            <h2>
                Prix
            </h2>
        </div>
        <div class="d-flex justify-content-start gap-3">
            <button class="filter-tag">Croissant</button>
            <button class="filter-tag">Décroissant</button>
        </div>
    </div>

    <div class="fields-price">
        <label for="#pice_value" class="pt-3 pb-2">Entre</label>
        <div class="row bg-white gap-1 pb-2 align-items-center">
            <div class="col-md-5">
                <input type="number" class="sm-input-field w-100" placeholder="500 frs">
            </div>
            <div class="col-md-1 p-0 text-center">
                <span class="text-center">Et</span>
            </div>
            <div class="col-md-5">
                <input type="number" class="sm-input-field w-100" placeholder="10 000 frs">
            </div>
        </div>
    </div>
</div>
