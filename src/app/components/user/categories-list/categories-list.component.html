<div class="categories-container p-4">
    <div class="title-list">
        <h2>Categories</h2>
    </div>

    <ul class="categories mb-4">
        <li class="category-item  py-2" *ngFor="let category of categories">
        <!-- <li class="category-item active_category py-2" *ngFor="let category of categories"> -->
            {{category.title}}
        </li>
    </ul>

    <div class="about-price">
        <div class="title-list mb-3">
            <h2>
                {{'user.cat-list.price' | translate}}
            </h2>
        </div>
        <div class="d-flex justify-content-start row">
            <div class="col-xl-4 mb-3">
                <button class="filter-tag">{{'user.cat-list.ascending' | translate}} </button>
            </div>
            <div class="col-xl-4 mb-3">
                <button class="filter-tag">{{'user.cat-list.descending' | translate}}</button>
            </div>
        </div>
    </div>

    <div class="fields-price">
        <label for="#pice_value" class="pt-3 pb-2">{{'user.cat-list.between' | translate}}</label>
        <div class="row bg-white gap-1 pb-2 align-items-center">
            <div class="col-md-5">
                <input type="number" class="sm-input-field w-100" placeholder="500 frs">
            </div>
            <div class="col-md-1 p-0 text-center">
                <span class="text-center">{{'user.cat-list.and' | translate}}</span>
            </div>
            <div class="col-md-5">
                <input type="number" class="sm-input-field w-100" placeholder="10 000 frs">
            </div>
        </div>
    </div>
</div>
