<div class="product-card">

    <!-- Image -->
    <div class="card-image" [routerLink]="['/product-details', productItem.id]">
        <img class="card-img" [src]="imageUrl" alt="" loading="lazy" width="280" height="200">
        <span class="card-location-badge">
            <i class="fas fa-map-marker-alt"></i>
            {{productItem.location}}
            <ng-container *ngIf="productItem.neighborhood">, {{productItem.neighborhood}}</ng-container>
        </span>
    </div>

    <!-- Body -->
    <div class="card-body">
        <h3 class="card-title">{{productItem.title}}</h3>

        <p class="card-price">
            {{productItem.price | currency:'XAF':'symbol':'1.0-0':'fr-CM'}}
        </p>

        <p class="card-desc">{{productItem.description}}</p>

        <!-- Contact actions -->
        <div class="card-contacts">
            <a *ngIf="productItem.users?.whatsapp_number"
                [href]="'tel:' + productItem.users?.whatsapp_number"
                class="contact-btn contact-phone"
                title="Appeler">
                <i class="fa-solid fa-phone"></i>
            </a>
            <a *ngIf="productItem.users?.whatsapp_number"
                [href]="'https://api.whatsapp.com/send?phone=' + productItem.users?.whatsapp_number + '&text=Hello Bailleurnet&source=&data='"
                target="_blank" rel="noopener noreferrer"
                class="contact-btn contact-wa"
                title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a *ngIf="productItem.users?.email"
                [href]="'mailto:' + productItem.users?.email + '?subject=' + subject + '&body=' + body"
                class="contact-btn contact-mail"
                title="Envoyer un email">
                <i class="fa-solid fa-envelope"></i>
            </a>
            <a [routerLink]="['/product-details', productItem.id]"
                class="contact-btn contact-view"
                title="Voir l'annonce">
                <i class="fa-solid fa-eye"></i>
            </a>
        </div>
    </div>

</div>
