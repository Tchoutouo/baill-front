<div class="product-item p-3">
    <div [routerLink]="['/product-details']" class="product-image mb-3" style="background-image: url('../../../../assets/products/product-item.png');">
    
    </div>
    <div class="product-details">
        <div class="product-name ">
            <h4>
                <i class="fas fa-map-marker-alt" style="font-size: 17px;"></i>
                Yaoundé
            </h4>
            <h3 class="m-0">Yaris</h3>
            
        </div>
        <div class="product-price">
            230 000frs
        </div>

        <div class="product-description">
            <p class="m-0">
                produitDescription courte du produit Description courte du
            </p>
        </div>
        <!-- <div class="phone mt-3 mb-1">
            <span>Tel :</span> +237 934 854 534
        </div> -->
        <div class="other-details align-items-center row mt-3">
            
            <div class="location-address col-xl-12">
                <div class="two_icon">
                    <a [href]="'tel:'+phone_number" target="_blank">
                        <i class="fa-solid fa-square-phone-flip" style="font-size: 23px;"></i> : {{phone_number}}
                    </a> 
                </div>
                <div class="two_icon ">
                    <a [href]="'https://'+siteUser" target="_blank" rel="noopener noreferrer">
                        <i class="fas fa-globe" style="font-size: 21px;"></i> : {{siteUser}}
                    </a> 
                </div>
                <div class="two_icon">
                    <a [href]="'https://api.whatsapp.com/send?phone='+whatsapp_number+'&text=Hello Bailleurnet&source=&data='" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-whatsapp" style="font-size: 24px;"></i> : {{whatsapp_number}}
                    </a>
                </div>
                <div class="two_icon">
                    <a [href]="'mailto:'+emailUser+'?subject=' + subject + '&body=' + body" target="_blank">
                        <i class="fa-solid fa-envelope" style="font-size: 21px;"></i> : {{emailUser}}
                    </a> 
                </div>
            </div>
        </div>
