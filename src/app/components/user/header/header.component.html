<!-- ── Barre info (masquée sur mobile) ── -->
<div class="top-bar">
    <div class="container-fluid px-3 px-md-4">
        <div class="top-bar-inner">
            <a class="top-bar-email" href="mailto:{{emailContact}}">
                <i class="fa-regular fa-envelope"></i>
                {{emailContact}}
            </a>
            <div class="top-bar-socials">
                <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
                <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
                <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
            </div>
        </div>
    </div>
</div>

<!-- ── Navigation principale ── -->
<nav class="main-nav" role="navigation" aria-label="Navigation principale">
    <div class="nav-inner container-fluid px-3 px-md-4">

        <!-- Gauche : retour + marque -->
        <div class="nav-brand">
            <button
                *ngIf="showBackButton"
                class="back-button"
                type="button"
                (click)="goBack()"
                aria-label="Retour à l'accueil">
                <i class="fa fa-arrow-left"></i>
                <span class="back-text">{{'button.back' | translate}}</span>
            </button>
            <a routerLink="/" class="brand-link" [attr.aria-label]="('header.home-aria-label' | translate) + ' ' + siteName">
                <img class="brand-logo" src="../../../../assets/baill-logo.ico" alt="">
                <span class="site_name">{{siteName}}</span>
            </a>
        </div>

        <!-- Droite : actions desktop -->
        <div class="nav-actions">
            <a [routerLink]="['/admin/announces/create']" class="nav-btn btn-publish">
                <i class="fas fa-plus"></i>
                {{'header.publish-post' | translate}}
            </a>
            <a [routerLink]="['/signin']" class="nav-btn btn-auth" *ngIf="!is_auth">
                <i class="fa-regular fa-user"></i>
                {{'header.login-text' | translate}}
            </a>
            <a [routerLink]="['/admin']" class="nav-btn btn-auth" *ngIf="is_auth">
                <i class="fa-regular fa-user"></i>
                {{'header.espace-text' | translate}}
            </a>
            <select class="lang-select" (change)="ChangeLanguage($event)" [attr.aria-label]="'header.language-label' | translate">
                <option [selected]="lang==='fr'" value="fr">{{'header.lang-french' | translate}}</option>
                <option [selected]="lang==='en'" value="en">{{'header.lang-english' | translate}}</option>
            </select>
        </div>

        <!-- Bouton hamburger (mobile uniquement) -->
        <button
            class="menu-toggle"
            type="button"
            (click)="toggleMenu()"
            [attr.aria-expanded]="isMenuOpen"
            aria-label="Ouvrir le menu">
            <span class="toggle-icon" [class.is-open]="isMenuOpen">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </button>

    </div>

    <!-- Menu mobile déroulant -->
    <div class="mobile-menu" [class.is-open]="isMenuOpen">
        <div class="mobile-menu-body">
            <a [routerLink]="['/admin/announces/create']" class="mobile-btn btn-publish-mobile" (click)="toggleMenu()">
                <i class="fas fa-plus"></i>
                {{'header.publish-post' | translate}}
            </a>
            <a [routerLink]="['/signin']" class="mobile-btn btn-auth-mobile" *ngIf="!is_auth" (click)="toggleMenu()">
                <i class="fa-regular fa-user"></i>
                {{'header.login-text' | translate}}
            </a>
            <a [routerLink]="['/admin']" class="mobile-btn btn-auth-mobile" *ngIf="is_auth" (click)="toggleMenu()">
                <i class="fa-regular fa-user"></i>
                {{'header.espace-text' | translate}}
            </a>
            <div class="mobile-lang-wrap">
                <label class="mobile-lang-label" for="lang-mobile">{{'header.language-label' | translate}}</label>
                <select id="lang-mobile" class="lang-select-mobile" (change)="ChangeLanguage($event)" [attr.aria-label]="'header.language-label' | translate">
                    <option [selected]="lang==='fr'" value="fr">{{'header.lang-french' | translate}}</option>
                    <option [selected]="lang==='en'" value="en">{{'header.lang-english' | translate}}</option>
                </select>
            </div>
        </div>
    </div>
</nav>
